name: DRTS monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drts-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run monitor
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          SEND_TEST: ${{ github.event_name == 'workflow_dispatch' }}
        run: python monitor.py

      - name: Save state
        if: always()
        run: |
          git config user.name "drts-bot"
          git config user.email "drts-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
